name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pygame pyinstaller

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Build SPACE_MINER.exe (graphical)
        run: pyinstaller --onefile --name SPACE_MINER --clean --noconfirm gui_main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPACE_MINER-windows-exe
          path: dist/SPACE_MINER.exe
          if-no-files-found: error
